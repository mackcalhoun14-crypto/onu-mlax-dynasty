name: Weekly Matchup & Trade Automation

on:
  schedule:
    - cron: '15 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Matchup & Trade AI Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLEEPER_LEAGUE_ID: "1312162066798231552"
        run: python scripts/generate_previews.py

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matchups.json data/trades.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update weekly matchups and trades data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
