name: Weekly Matchup & Trade Automation

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts

      - name: Run Preview & Trade Generator Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: |
          python scripts/generate_previews.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matchups.json data/trades.json data/audio/
          git diff --staged --quiet || git commit -m "Auto-update weekly matchups, trades, and audio [skip ci]"
          git push
