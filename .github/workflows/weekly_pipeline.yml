name: Weekly Matchup & Trade Automation

on:
  schedule:
    - cron: '0 12 * * TUE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Changes
        run: |
          git pull origin main --rebase || echo "No remote changes to pull"

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Preview & Trade Generator Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: |
          python scripts/generate_previews.py

      - name: Commit and Push Updated Data
        run: |
          git add data/matchups.json data/trades.json data/standings.json
          git diff --staged --quiet || git commit -m "Auto-update weekly matchups, trades, and standings [skip ci]"
          git push
